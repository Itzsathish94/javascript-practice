<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="counter" onclick="handleClick()">0</button>
</body>
<script>
    let count = 0;
    function handleClick(){
        console.log(count);
        count++;
        document.getElementById('counter').textContent = count;
    }
</script>
</html>
